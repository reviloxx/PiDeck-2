GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=0
GRUB_RECORDFAIL_TIMEOUT=0
GRUB_TERMINAL=console
# No Plymouth splash on x86: GPU modeset is too late for a meaningful splash
# without stuffing drivers into the initrd, and a late flash is worse than none.
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }quiet loglevel=3 systemd.show_status=false"
