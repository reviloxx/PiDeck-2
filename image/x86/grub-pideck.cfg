GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=0
GRUB_RECORDFAIL_TIMEOUT=0
GRUB_TERMINAL=console
# pcie_ports=compat: less time on empty hotplug root ports when BIOS cannot
# disable them. libata.force=4.00:disable: skip the always-down ata4 link.
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }quiet splash loglevel=3 pcie_ports=compat libata.force=4.00:disable"
