# PulseAudio profile set for C-Media Oxygen / ASUS Virtuoso (Xonar DX family).
# Digital S/PDIF is ALSA PCM device 1; open it as hw:%f,1 so profile probing
# does not depend on the iec958:%f control-element hooks.

[General]
auto-profiles = yes

[Mapping analog-stereo]
device-strings = front:%f hw:%f
channel-map = left,right
paths-output = analog-output analog-output-lineout analog-output-speaker
priority = 10
direction = output

[Mapping analog-surround-51]
device-strings = surround51:%f
channel-map = left,right,rear-left,rear-right,front-center,lfe
paths-output = analog-output analog-output-lineout analog-output-speaker
priority = 8
direction = output

[Mapping analog-surround-71]
device-strings = surround71:%f
channel-map = left,right,rear-left,rear-right,front-center,lfe,side-left,side-right
paths-output = analog-output analog-output-lineout analog-output-speaker
priority = 7
direction = output

[Mapping iec958-stereo]
device-strings = hw:%f,1
channel-map = left,right
paths-output = iec958-stereo-output
priority = 9
direction = output
