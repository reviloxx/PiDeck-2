[Unit]
Requires=pideck-activate.service
Wants=pideck-updater.service
After=pideck-activate.service pideck-updater.service

[Service]
# GPU drivers load from the root filesystem; start X only after they bind.
ExecStartPre=-/usr/bin/udevadm settle --timeout=20
ExecStart=
ExecStart=-/usr/lib/pideck/pideck-getty %I
