[Unit]
Requires=pideck-activate.service
Wants=pideck-updater.service pideck-nvidia-load.service
After=pideck-activate.service pideck-updater.service pideck-nvidia-load.service

[Service]
# GPU drivers load from the root filesystem; start X only after a DRM card binds.
ExecStartPre=-/usr/lib/pideck/pideck-wait-drm
ExecStart=
ExecStart=-/usr/lib/pideck/pideck-getty %I
