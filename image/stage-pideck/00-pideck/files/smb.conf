[global]
   workgroup = WORKGROUP
   server string = PiDeck
   security = user
   map to guest = Bad User
   usershare allow guests = yes
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   # Per-drive guest shares are managed by Settings > Drives.
   include = /var/lib/pideck/samba/shares.conf
