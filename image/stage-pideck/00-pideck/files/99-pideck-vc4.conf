# Pi 5 exposes both vc4 (display) and v3d (render). Without this, Xorg may
# bind modesetting to v3d and fail with "no screens found" while the console
# still shows on HDMI.
Section "OutputClass"
    Identifier "vc4"
    MatchDriver "vc4"
    Driver "modesetting"
    Option "PrimaryGPU" "true"
EndSection
