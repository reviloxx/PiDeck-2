name: Publish PiDeck update

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build update
        run: |
          set -eu
          python3 image/update_bundle.py --tag "$GITHUB_REF_NAME" --output release-assets

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" \
            release-assets/pideck-update.tar \
            release-assets/pideck-update.json \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
